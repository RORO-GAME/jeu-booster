<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boosters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800;1,900&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root {
  --nuit: #0b1118;
  --surface: #141f2b;
  --ligne: #26394b;
  --texte: #e9eef3;
  --doux: #8da1b3;
  /* une couleur par rareté : commune, rare, super rare, ultra rare, légendaire, secrète */
  --rc0: #93ab9d;
  --rc1: #4c9bff;
  --rc2: #c35cff;
  --rc3: #ff4458;
  --rc4: #f2c14e;
  --rc5: #dfe6f0;
}
[data-r="0"] { --c: #93ab9d; --c-clair: #cadad1; --c-fonce: #5d7469; }
[data-r="1"] { --c: #4c9bff; --c-clair: #a9d1ff; --c-fonce: #2a62c4; }
[data-r="2"] { --c: #c35cff; --c-clair: #ff86dc; --c-fonce: #7a46f0; }
[data-r="3"] { --c: #ff4458; --c-clair: #ff9c9c; --c-fonce: #c4122a; }
[data-r="4"] { --c: #f2c14e; --c-clair: #fff1ae; --c-fonce: #a8741d;
  --bord: linear-gradient(150deg, #fff3b8, #e2ad45 30%, #a8741d 52%, #f1cf6a 78%, #fff0a8); }
[data-r="5"] { --c: #dfe6f0; --c-clair: #ffffff; --c-fonce: #8fa0b5;
  --bord: linear-gradient(150deg, #ffffff, #bcc8d8 26%, #f4f8ff 48%, #9eb0c6 72%, #f6faff); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--nuit); }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--texte);
  font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 16px;
  line-height: 1.5;
  background: radial-gradient(1100px 520px at 50% -8%, #1b2f42, transparent) no-repeat, var(--nuit);
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--texte); outline-offset: 3px; }

.page { max-width: 1000px; margin: 0 auto; padding: 0 16px 48px; }

/* ---------- en-tête ---------- */
.entete { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px 32px; padding: 28px 0 20px; }
h1 { margin: 0; font-size: clamp(40px, 9vw, 64px); line-height: 1; font-weight: 800; letter-spacing: -0.035em; }
.sous { margin: 6px 0 0; color: var(--doux); }
.stats { display: flex; flex-wrap: wrap; gap: 12px 28px; margin: 0; }
.stats dt { font-size: 13px; color: var(--doux); }
.stats dd { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.2; }
.stats .garantie dd { font-size: 15px; font-weight: 600; }
.stats dd.pieces::before { content: ""; display: inline-block; width: .6em; height: .6em; margin-right: .35em; border-radius: 50%; background: var(--rc4); box-shadow: inset 0 0 0 .12em rgba(0, 0, 0, .25); }
.jauge { height: 4px; margin-top: 7px; border-radius: 2px; background: var(--ligne); overflow: hidden; }
.jauge span { display: block; height: 100%; width: 0; background: var(--texte); transition: width .5s ease; }
.jauge.large { height: 6px; }

/* ---------- onglets ---------- */
.onglets { display: flex; gap: 4px; border-bottom: 1px solid var(--ligne); }
.onglets button { padding: 10px 14px; background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--doux); cursor: pointer; font-weight: 600; }
.onglets button[aria-selected="true"] { color: var(--texte); border-bottom-color: var(--texte); }
.onglets button:disabled { opacity: .45; cursor: default; }

/* ---------- scène du booster ---------- */
.scene { display: grid; place-items: center; min-height: clamp(380px, 62vw, 520px); padding: 28px 0 8px; }
.pack {
  position: relative; width: clamp(170px, 40vw, 224px); aspect-ratio: 5 / 7;
  border: 0; border-radius: 10px; cursor: pointer; color: #fff; overflow: hidden;
  background: linear-gradient(125deg, #2c4a63, #6f98b8 38%, #2c4a63 56%, #1f3649);
  box-shadow: 0 24px 40px -20px rgba(0, 0, 0, .8), inset 0 0 0 1px rgba(255, 255, 255, .18);
  transition: transform .25s ease;
}
.pack:hover:not(:disabled) { transform: translateY(-6px) rotate(-1.2deg); }
.pack:disabled { cursor: progress; filter: saturate(.4) brightness(.8); }
.pack::before, .pack::after {
  content: ""; position: absolute; left: 0; right: 0; height: 16px;
  background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .28) 0 3px, rgba(0, 0, 0, .25) 3px 6px);
}
.pack::before { top: 0; }
.pack::after { bottom: 0; }
.pack-centre { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 4px; }
.pack-titre { font-size: clamp(30px, 7.5vw, 40px); font-weight: 800; letter-spacing: -0.03em; text-shadow: 0 2px 10px rgba(0, 0, 0, .35); }
.pack-nb { font-size: 14px; opacity: .85; }
.pack-points { position: absolute; left: 0; right: 0; bottom: 30px; display: flex; justify-content: center; gap: 7px; }
.pack-points span { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1px rgba(255, 255, 255, .6); }
.pack.ouvre { animation: secoue .95s ease-in forwards; pointer-events: none; }
@keyframes secoue {
  0%   { transform: rotate(0); }
  12%  { transform: rotate(-4deg) translateX(-4px); }
  24%  { transform: rotate(4deg) translateX(4px); }
  36%  { transform: rotate(-5deg) translateX(-3px); }
  48%  { transform: rotate(5deg) scale(1.03); }
  62%  { transform: scale(1.1); filter: brightness(1.3); }
  100% { transform: scale(1.55); opacity: 0; filter: brightness(2.6); }
}

/* ---------- les cartes : conteneurs, retournement, inclinaison ---------- */
.rangee { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 12px; width: 100%; }
.carte {
  position: relative; width: clamp(132px, 41vw, 176px); aspect-ratio: 5 / 7;
  padding: 0; border: 0; background: none; cursor: pointer; perspective: 900px;
}
.carte.retournee { cursor: default; }
.carte::before {  /* halo derrière les belles cartes */
  content: ""; position: absolute; inset: 5% 3%; border-radius: 12%; z-index: -1;
  background: var(--c); filter: blur(24px); opacity: 0; transition: opacity .5s .3s;
}
.carte.eclat::before { opacity: .5; }
.carte-fixe { position: relative; aspect-ratio: 5 / 7; perspective: 900px; }

.tilt {
  position: absolute; inset: 0; transform-style: preserve-3d;
  transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
  transition: transform .4s ease-out;
}
.survol .tilt { transition: transform .06s linear; }
.flip { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .6s cubic-bezier(.3, .7, .2, 1); }
.carte.retournee .flip { transform: rotateY(180deg); }
.rangee.distribue .carte { animation: donne .6s cubic-bezier(.2, .8, .2, 1) both; animation-delay: var(--delai); }
@keyframes donne { from { opacity: 0; transform: translateY(70px) scale(.9) rotate(-5deg); } }

/* ---------- le dessin d'une carte (tout est en cqw : ça suit la largeur de la carte) ---------- */
.face { position: absolute; inset: 0; container-type: inline-size; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; font-style: italic; font-weight: 800; }
.recto { transform: rotateY(180deg); }
.carte-fixe .recto { transform: none; }

.verso {
  display: grid; place-items: center; border-radius: 7cqw;
  background: radial-gradient(circle at 50% 42%, #2a455c, #101a25 72%);
  box-shadow: inset 0 0 0 .9cqw #3d5a73, 0 1.5cqw 5cqw rgba(0, 0, 0, .5);
}
.verso .logo { position: static; width: 30cqw; height: 30cqw; color: #6f93b1; }

.ext {  /* le cadre coloré */
  position: absolute; inset: 0; padding: 3.4cqw; border-radius: 7cqw;
  background: var(--bord, linear-gradient(150deg, var(--c-clair), var(--c-fonce) 52%, var(--c)));
  box-shadow: 0 1.5cqw 5cqw rgba(0, 0, 0, .55);
}
.int { position: relative; width: 100%; height: 100%; border-radius: 4.2cqw; overflow: hidden; background: #0a0f16; isolation: isolate; }
.art { position: absolute; inset: 0; }
.art img { display: block; width: 100%; height: 100%; object-fit: cover; }
.art.sans-image {
  display: grid; place-items: center;
  background:
    repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 16%, transparent) 0 2cqw, transparent 2cqw 6cqw),
    radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--c) 40%, #0d141c), #0a0f15 72%);
}
.grand { font-size: 52cqw; line-height: 1; color: var(--c-clair); opacity: .45; margin-top: -10cqw; }
.ombre { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(4, 7, 12, .6), rgba(4, 7, 12, 0) 24%, rgba(4, 7, 12, 0) 50%, rgba(4, 7, 12, .9)); }

.code {
  position: absolute; top: 5cqw; left: 5cqw; min-width: 15cqw; padding: .1em .5em; border-radius: 3cqw; text-align: center;
  background: linear-gradient(150deg, var(--c-clair), var(--c)); color: #10131c; font-size: 10cqw; line-height: 1.25;
}
.tag {
  position: absolute; top: 6.4cqw; left: 50%; transform: translateX(-50%); max-width: 46cqw;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: .3em .9em; border-radius: 999px;
  background: rgba(0, 0, 0, .5); color: rgba(255, 255, 255, .8); font-size: 6.2cqw; letter-spacing: .05em; text-transform: uppercase;
}
.num { position: absolute; top: 6.4cqw; right: 5.5cqw; font-size: 8.5cqw; color: rgba(255, 255, 255, .92); text-shadow: 0 1px 6px rgba(0, 0, 0, .6); }
.bas { position: absolute; left: 6cqw; right: 20cqw; bottom: 11.5cqw; display: flex; flex-direction: column; gap: 1cqw; }
.fin { font-size: 6.2cqw; letter-spacing: .07em; text-transform: uppercase; color: rgba(255, 255, 255, .88); }
.nom { font-size: 15cqw; line-height: .98; text-transform: uppercase; color: #fff; text-shadow: 0 2px 10px rgba(0, 0, 0, .55); overflow-wrap: anywhere; }
.trait { position: absolute; left: 6cqw; bottom: 7cqw; width: 68cqw; height: 1.1cqw; border-radius: 1cqw; background: linear-gradient(90deg, var(--c), transparent); }
.logo { position: absolute; right: 6cqw; bottom: 5.5cqw; width: 11cqw; height: 11cqw; color: rgba(255, 255, 255, .78); }

/* effets brillants : la lumière suit le doigt ou la souris */
.foil, .glare { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
.foil {
  mix-blend-mode: color-dodge;
  background: linear-gradient(115deg, #ff7ad9, #ffe36b 18%, #8ef0a3 34%, #6fd0ff 50%, #a58bff 66%, #ff7ad9 84%, #ffe36b);
  background-size: 250% 250%;
}
.glare {
  mix-blend-mode: overlay;
  background: radial-gradient(circle at var(--mx, 30%) var(--my, 22%), rgba(255, 255, 255, .6), transparent 46%);
}
[data-f="arc"] .foil { animation: derive 7s linear infinite alternate; }
[data-f="brillante"] .foil {  /* brillante : un simple reflet blanc qui balaie la carte, sans aucune couleur */
  mix-blend-mode: screen;
  background:
    linear-gradient(115deg, transparent 34%, rgba(255, 255, 255, .62) 46%, rgba(255, 255, 255, .2) 56%, transparent 66%),
    linear-gradient(135deg, rgba(255, 255, 255, .22), transparent 42%);
  background-size: 300% 100%, 100% 100%;
  animation: balayage 5s ease-in-out infinite;
}
.survol [data-f] .foil { animation: none; background-position: var(--mx, 40%) var(--my, 30%); }
@keyframes derive { from { background-position: 0% 20%; } to { background-position: 100% 80%; } }
@keyframes balayage { from { background-position: 120% 0; } to { background-position: -20% 0; } }

[data-r="4"] .glare { opacity: .8; }
[data-r="5"] .foil { opacity: .14; }  /* la secrète a toujours un reflet irisé très discret */
[data-r="5"] .glare { opacity: 1; }
[data-f="brillante"] .foil { opacity: 1; }
[data-f="arc"] .foil { opacity: .6; }
[data-f="brillante"] .glare { mix-blend-mode: screen; opacity: .5; }
[data-f="arc"] .glare { opacity: 1; }
[data-f="brillante"] .int::after, [data-f="arc"] .int::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: overlay; opacity: .4;
  background: radial-gradient(circle, rgba(255, 255, 255, .9) 0 .7px, transparent 1.3px) 0 0 / 6cqw 6cqw;
  animation: scintille 3s ease-in-out infinite;
}
@keyframes scintille { 50% { opacity: .12; } }
[data-f="brillante"] .int::after { background-size: 10cqw 10cqw; opacity: .5; }  /* quelques paillettes blanches, plus espacées */
[data-f="arc"] .ext { background: linear-gradient(135deg, #ffe36b, #8ef0a3 22%, #6fd0ff 42%, #a58bff 62%, #ff7ad9 82%, #ff9a5c); }

.reflet {  /* reflet qui passe sur les légendaires et les secrètes */
  position: absolute; inset: 0; border-radius: 7cqw; pointer-events: none; mix-blend-mode: soft-light;
  background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, .95) 48%, transparent 66%);
  background-size: 260% 100%; background-position: 130% 0; animation: brille 5s ease-in-out infinite;
}
@keyframes brille { to { background-position: -30% 0; } }

.badge {
  position: absolute; top: -6.5cqw; left: 50%; transform: translateX(-50%);
  padding: .2em .8em; border-radius: 999px; white-space: nowrap;
  background: var(--texte); color: var(--nuit); font-size: 7.4cqw; font-style: normal; font-weight: 700;
  box-shadow: 0 .5cqw 2cqw rgba(0, 0, 0, .5);
}
.badge.nb { left: auto; right: 4cqw; transform: none; }
.badge.gain { top: auto; bottom: -6.5cqw; background: var(--rc4); color: #1d1503; }  /* pièces gagnées avec un doublon */

.manquante .ext { background: #1d2b39; box-shadow: none; }
.manquante .int { background: #0a1118; }
.manquante .art { opacity: .5; }
.manquante .ombre, .manquante .foil, .manquante .glare, .manquante .reflet { display: none; }
.manquante .code { background: #243545; color: #587087; }
.manquante .nom { color: #587087; text-shadow: none; }
.manquante .num, .manquante .logo { color: #3d5266; text-shadow: none; }
.manquante .trait { background: linear-gradient(90deg, #2a3f52, transparent); }

#flash { position: fixed; inset: 0; z-index: 10; pointer-events: none; opacity: 0;
  background: radial-gradient(circle at 50% 55%, color-mix(in srgb, var(--fc, #fff) 55%, transparent), transparent 62%); }
#flash.on { animation: eclair .8s ease-out; }
@keyframes eclair { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }

/* ---------- messages et boutons ---------- */
.message { min-height: 3em; margin: 12px auto 0; max-width: 56ch; text-align: center; color: var(--doux); }
.actions { display: flex; justify-content: center; gap: 12px; min-height: 48px; }
.btn { padding: 11px 20px; border: 0; border-radius: 10px; background: var(--texte); color: var(--nuit); font-weight: 700; cursor: pointer; }
.btn:hover { background: #fff; }
.btn.discret { background: none; color: var(--doux); padding: 0; font-weight: 500; text-decoration: underline; border-radius: 0; }
.btn.discret:hover { background: none; color: var(--texte); }

/* ---------- collection ---------- */
.coll-tete { padding: 24px 0 8px; }
h2 { margin: 0 0 8px; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
.coll-tete .sous { margin: 0 0 10px; }
.filtres { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 0 20px; }
.filtres button { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--ligne); background: none; cursor: pointer; font-size: 14px; }
.filtres button[data-r]::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.filtres button[aria-pressed="true"] { background: var(--surface); border-color: var(--texte); }
.grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 18px 14px; }

footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--ligne); color: var(--doux); font-size: 14px; }
footer p { margin: 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="page">
  <header class="entete">
    <div>
      <h1>Boosters</h1>
      <p class="sous">Ouvre des boosters et complète ta collection.</p>
    </div>
    <dl class="stats">
      <div><dt>Boosters ouverts</dt><dd id="st-ouverts">0</dd></div>
      <div><dt>Pièces</dt><dd class="pieces" id="st-pieces">0</dd></div>
      <div class="garantie">
        <dt id="st-garantie-titre">Carte rare garantie</dt>
        <dd id="st-garantie">…</dd>
        <div class="jauge"><span id="jauge"></span></div>
      </div>
    </dl>
  </header>

  <nav class="onglets" role="tablist" aria-label="Sections">
    <button type="button" role="tab" id="t-boosters" aria-selected="true" aria-controls="v-boosters">Booster</button>
    <button type="button" role="tab" id="t-collection" aria-selected="false" aria-controls="v-collection" disabled>Collection <span id="t-compte"></span></button>
  </nav>

  <main>
    <section id="v-boosters" role="tabpanel" aria-labelledby="t-boosters">
      <div class="scene">
        <button type="button" class="pack" id="pack" disabled aria-label="Ouvrir un booster">
          <span class="pack-centre">
            <span class="pack-titre">Booster</span>
            <span class="pack-nb" id="pack-nb"></span>
          </span>
          <span class="pack-points" id="pack-points" aria-hidden="true"></span>
        </button>
        <div class="rangee" id="rangee" hidden></div>
      </div>
      <p class="message" id="message" aria-live="polite">Chargement du moteur Python…</p>
      <div class="actions">
        <button type="button" class="btn" id="btn-tout" hidden>Tout retourner</button>
        <button type="button" class="btn" id="btn-autre" hidden>Ouvrir un autre booster</button>
      </div>
    </section>

    <section id="v-collection" role="tabpanel" aria-labelledby="t-collection" hidden>
      <div class="coll-tete">
        <h2 id="coll-titre"></h2>
        <p class="sous" id="coll-finitions"></p>
        <div class="jauge large"><span id="coll-jauge"></span></div>
      </div>
      <div class="filtres" id="filtres" role="group" aria-label="Filtrer par rareté"></div>
      <div class="grille" id="grille"></div>
    </section>
  </main>

  <footer>
    <p>Ta collection est enregistrée dans ce navigateur.</p>
    <button type="button" class="btn discret" id="reset">Effacer ma collection</button>
  </footer>
</div>
<div id="flash"></div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
"use strict";

const CLE = "boosters-sauvegarde-v2";
const reduit = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (s) => document.querySelector(s);
const attendre = (ms) => new Promise((ok) => setTimeout(ok, ms));
const pad = (n) => String(n).padStart(3, "0");
const pluriel = (n, un, plusieurs) => n + " " + (n > 1 ? plusieurs : un);
const majuscule = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const NOMS_FIN = { "brillante": "Brillante", "arc-en-ciel": "Arc-en-ciel" };
const classeFin = (f) => (f === "arc-en-ciel" ? "arc" : f || "normale");

function el(tag, cls, texte) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (texte !== undefined) n.textContent = texte;
  return n;
}

let REGL = null;          // réglages venus de moteur.py
let CARTES = [];          // contenu de cartes.json
let CARTES_TXT = "";
let ouvrirPy = null;      // fonction Python ouvrir_booster_web
let etat = null;          // progression du joueur
let phase = "chargement"; // chargement | pret | ouverture | reveal | fini
let tirage = [];
let retournees = 0;
let garantieDeclenchee = false;
let gainRestant = 0;      // pièces des cartes pas encore retournées (elles s'ajoutent au compteur au fil des retournements)
let filtre = -1;

const rang = (c) => REGL.ordre.indexOf(c.rarete);

/* ---------- sauvegarde dans le navigateur ---------- */
function lireSauvegarde() {
  try {
    const t = localStorage.getItem(CLE);
    if (!t) return null;
    const e = JSON.parse(t);
    if (e && typeof e.collection === "object" && Number.isFinite(e.boosters_ouverts) && Number.isFinite(e.sans_rare)) {
      e.finitions = e.finitions || {};
      e.monnaie = Number.isFinite(e.monnaie) ? e.monnaie : 0;
      return e;
    }
  } catch (_) { /* navigateur sans stockage : on repart de zéro */ }
  return null;
}
function ecrireSauvegarde() {
  try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (_) { /* pas de sauvegarde possible */ }
}

/* ---------- dessin d'une carte ---------- */
function etoile() {  // petit symbole en bas à droite des cartes ; remplace-le par ton logo quand tu en auras un
  const NS = "http://www.w3.org/2000/svg";
  const s = document.createElementNS(NS, "svg");
  s.setAttribute("viewBox", "0 0 24 24");
  s.setAttribute("class", "logo");
  s.setAttribute("aria-hidden", "true");
  const p = document.createElementNS(NS, "path");
  p.setAttribute("d", "M12 1.5c.9 5.6 4.9 9.6 10.5 10.5-5.6.9-9.6 4.9-10.5 10.5C11.1 16.9 7.1 12.9 1.5 12 7.1 11.1 11.1 7.1 12 1.5z");
  p.setAttribute("fill", "currentColor");
  s.append(p);
  return s;
}

function versoCarte() {
  const v = el("span", "face verso");
  v.append(etoile());
  return v;
}

function faceCarte(c, o = {}) {
  const r = rang(c);
  const fin = o.manquante ? "normale" : o.finition || "normale";
  const f = el("div", "face recto" + (o.manquante ? " manquante" : ""));
  f.dataset.r = r;
  f.dataset.f = classeFin(fin);

  const ext = el("div", "ext");
  const int = el("div", "int");

  const art = el("div", "art");
  if (o.manquante) {
    art.classList.add("sans-image");
    art.append(el("span", "grand", "?"));
  } else {
    const img = new Image();
    img.alt = "";
    img.src = c.image;
    img.addEventListener("error", () => {
      img.remove();
      art.classList.add("sans-image");
      art.append(el("span", "grand", String(c.id)));
    });
    art.append(img);
  }
  int.append(art, el("div", "ombre"), el("div", "foil"), el("div", "glare"));

  int.append(el("span", "code", REGL.codes[r]));
  if (c.tag && !o.manquante) int.append(el("span", "tag", c.tag));
  int.append(el("span", "num", "#" + pad(c.id)));

  const bas = el("div", "bas");
  if (fin !== "normale") bas.append(el("span", "fin", "✦ " + NOMS_FIN[fin]));
  const nom = el("span", "nom", o.manquante ? "???" : c.nom);
  nom.style.fontSize = (c.nom.length > 16 ? 9.5 : c.nom.length > 11 ? 12 : 15) + "cqw";
  bas.append(nom);
  int.append(bas, el("i", "trait"), etoile());

  ext.append(int);
  if (r >= 4 && !o.manquante) ext.append(el("div", "reflet"));
  f.append(ext);

  if (o.nouvelle) f.append(el("span", "badge", "Nouvelle"));
  else if (o.nouvelleFinition) f.append(el("span", "badge", "Nouvelle finition"));
  if (o.nb > 1) f.append(el("span", "badge nb", "×" + o.nb));
  if (o.pieces > 0) f.append(el("span", "badge gain", "+" + pluriel(o.pieces, "pièce", "pièces")));
  return f;
}

/* la carte s'incline et la lumière suit le doigt ou la souris */
function activerInclinaison(zone) {
  if (reduit) return;
  zone.addEventListener("pointermove", (e) => {
    if (zone.classList.contains("carte") && !zone.classList.contains("retournee")) return;
    const b = zone.getBoundingClientRect();
    const x = Math.min(Math.max((e.clientX - b.left) / b.width, 0), 1);
    const y = Math.min(Math.max((e.clientY - b.top) / b.height, 0), 1);
    zone.classList.add("survol");
    zone.style.setProperty("--mx", (x * 100).toFixed(1) + "%");
    zone.style.setProperty("--my", (y * 100).toFixed(1) + "%");
    zone.style.setProperty("--rx", ((0.5 - y) * 16).toFixed(2) + "deg");
    zone.style.setProperty("--ry", ((x - 0.5) * 18).toFixed(2) + "deg");
  });
  const fin = () => {
    zone.classList.remove("survol");
    for (const k of ["--mx", "--my", "--rx", "--ry"]) zone.style.removeProperty(k);
  };
  zone.addEventListener("pointerleave", fin);
  zone.addEventListener("pointercancel", fin);
}

function carteBooster(c, i) {
  const b = el("button", "carte");
  b.type = "button";
  b.dataset.r = rang(c);
  b.style.setProperty("--delai", i * 110 + "ms");
  b.setAttribute("aria-label", `Carte ${i + 1} sur ${tirage.length}, face cachée. Retourner.`);
  const tilt = el("span", "tilt");
  const flip = el("span", "flip");
  flip.append(versoCarte(), faceCarte(c, { nouvelle: c.nouvelle, nouvelleFinition: c.nouvelle_finition, finition: c.finition, pieces: c.pieces }));
  tilt.append(flip);
  b.append(tilt);
  b.addEventListener("click", () => retourner(b, c));
  activerInclinaison(b);
  return b;
}

/* ---------- ouverture d'un booster ---------- */
function flash(couleur) {
  if (reduit) return;
  const f = $("#flash");
  f.style.setProperty("--fc", couleur);
  f.classList.remove("on");
  void f.offsetWidth;
  f.classList.add("on");
}

function majMessage() {
  const m = $("#message");
  if (phase === "pret") {
    m.textContent = "Clique sur le booster pour l'ouvrir.";
  } else if (phase === "ouverture") {
    m.textContent = "";
  } else if (phase === "reveal") {
    m.textContent = `Retourne les cartes une par une. ${retournees} sur ${tirage.length} retournées.`;
  } else if (phase === "fini") {
    const n = tirage.filter((c) => c.nouvelle).length;
    let t = n ? `${pluriel(n, "nouvelle carte", "nouvelles cartes")} dans ce booster.` : "Que des doublons dans ce booster.";
    if (tirage.some((c) => c.finition === "arc-en-ciel")) t += " Une carte arc-en-ciel !";
    else if (tirage.some((c) => c.finition === "brillante")) t += " Une carte brillante !";
    const gain = tirage.reduce((s, c) => s + (c.pieces || 0), 0);
    if (gain > 0) t += ` Tes doublons rapportent ${pluriel(gain, "pièce", "pièces")}.`;
    if (garantieDeclenchee) t += ` La garantie s'est déclenchée : une carte ${REGL.pitie_rarete} ou mieux t'était réservée.`;
    m.textContent = t;
  }
}

async function ouvrir() {
  if (phase !== "pret") return;
  phase = "ouverture";
  majMessage();
  let res;
  try {
    res = JSON.parse(ouvrirPy(CARTES_TXT, JSON.stringify(etat)));
  } catch (e) {
    console.error(e);
    phase = "pret";
    $("#message").textContent = "Le tirage a échoué : " + (e.message || e);
    return;
  }
  etat = res.etat;
  tirage = res.cartes;
  garantieDeclenchee = res.pitie;
  retournees = 0;
  gainRestant = tirage.reduce((s, c) => s + (c.pieces || 0), 0);
  ecrireSauvegarde();
  majStats();

  const pack = $("#pack");
  pack.classList.add("ouvre");
  await attendre(reduit ? 0 : 950);
  pack.hidden = true;

  const rangee = $("#rangee");
  rangee.replaceChildren(...tirage.map(carteBooster));
  rangee.hidden = false;
  rangee.classList.add("distribue");
  phase = "reveal";
  majMessage();
  $("#btn-tout").hidden = false;
  rangee.firstElementChild.focus({ preventScroll: true });
}

function retourner(b, c) {
  if (phase !== "reveal" || b.classList.contains("retournee")) return;
  b.classList.add("retournee");
  const fin = c.finition !== "normale" ? ", " + NOMS_FIN[c.finition].toLowerCase() : "";
  b.setAttribute("aria-label", `${c.nom}, ${c.rarete}${fin}${c.nouvelle ? ", nouvelle" : ""}`);
  retournees++;
  gainRestant -= c.pieces || 0;
  majPieces();
  const r = rang(c);
  if (r >= 2 || c.finition !== "normale") b.classList.add("eclat");
  if (c.finition === "arc-en-ciel") flash("#ffffff");
  else if (r >= 3) flash(`var(--rc${r})`);
  if (retournees === tirage.length) terminer();
  else majMessage();
}

async function toutRetourner() {
  if (phase !== "reveal") return;
  $("#btn-tout").hidden = true;
  const cartes = [...$("#rangee").children];
  for (let i = 0; i < cartes.length; i++) {
    if (!cartes[i].classList.contains("retournee")) {
      retourner(cartes[i], tirage[i]);
      await attendre(reduit ? 0 : 260);
    }
  }
}

function terminer() {
  phase = "fini";
  $("#btn-tout").hidden = true;
  $("#btn-autre").hidden = false;
  $("#btn-autre").focus({ preventScroll: true });
  majMessage();
  majCollection();
}

function autreBooster() {
  const rangee = $("#rangee");
  rangee.hidden = true;
  rangee.replaceChildren();
  rangee.classList.remove("distribue");
  const pack = $("#pack");
  pack.classList.remove("ouvre");
  pack.hidden = false;
  $("#btn-tout").hidden = true;
  $("#btn-autre").hidden = true;
  phase = "pret";
  majMessage();
  pack.focus({ preventScroll: true });
}

/* ---------- statistiques et collection ---------- */
function majPieces() {
  $("#st-pieces").textContent = etat.monnaie - gainRestant;
}

function majStats() {
  $("#st-ouverts").textContent = etat.boosters_ouverts;
  majPieces();
  $("#st-garantie-titre").textContent = `Carte ${REGL.pitie_rarete} ou mieux garantie`;
  const restant = Math.max(REGL.pitie_apres - etat.sans_rare, 0) + 1;
  $("#st-garantie").textContent = `dans ${pluriel(restant, "booster", "boosters")} au plus`;
  $("#jauge").style.width = Math.min(etat.sans_rare / REGL.pitie_apres, 1) * 100 + "%";
}

function meilleureFinition(c) {
  const f = etat.finitions[String(c.id)] || {};
  return f["arc-en-ciel"] > 0 ? "arc-en-ciel" : f["brillante"] > 0 ? "brillante" : "normale";
}

function majCollection() {
  const nb = (c) => etat.collection[String(c.id)] || 0;
  const possedees = CARTES.filter((c) => nb(c) > 0).length;
  const brillantes = CARTES.filter((c) => (etat.finitions[String(c.id)] || {})["brillante"] > 0).length;
  const arcs = CARTES.filter((c) => (etat.finitions[String(c.id)] || {})["arc-en-ciel"] > 0).length;
  $("#t-compte").textContent = `${possedees}/${CARTES.length}`;
  $("#coll-titre").textContent = `${possedees} cartes sur ${CARTES.length}`;
  $("#coll-finitions").textContent = `${pluriel(brillantes, "carte brillante", "cartes brillantes")} · ${pluriel(arcs, "carte arc-en-ciel", "cartes arc-en-ciel")}`;
  $("#coll-jauge").style.width = (CARTES.length ? (possedees / CARTES.length) * 100 : 0) + "%";

  const filtres = $("#filtres");
  filtres.replaceChildren();
  const bouton = (libelle, valeur, r) => {
    const b = el("button", "", libelle);
    b.type = "button";
    if (r !== undefined) b.dataset.r = r;
    b.setAttribute("aria-pressed", String(filtre === valeur));
    b.addEventListener("click", () => { filtre = valeur; majCollection(); });
    filtres.append(b);
  };
  bouton(`Toutes ${possedees}/${CARTES.length}`, -1);
  REGL.ordre.forEach((nom, r) => {
    const lot = CARTES.filter((c) => rang(c) === r);
    if (!lot.length) return;
    bouton(`${majuscule(nom)} ${lot.filter((c) => nb(c) > 0).length}/${lot.length}`, r, r);
  });

  const grille = $("#grille");
  grille.replaceChildren();
  CARTES
    .filter((c) => filtre === -1 || rang(c) === filtre)
    .sort((a, b) => rang(a) - rang(b) || a.id - b.id)
    .forEach((c) => {
      const n = nb(c);
      const conteneur = el("div", "carte-fixe");
      conteneur.dataset.r = rang(c);
      const tilt = el("div", "tilt");
      tilt.append(faceCarte(c, { manquante: n === 0, nb: n, finition: meilleureFinition(c) }));
      conteneur.append(tilt);
      if (n === 0) conteneur.setAttribute("aria-label", `Carte n° ${c.id}, pas encore trouvée`);
      else activerInclinaison(conteneur);
      grille.append(conteneur);
    });
}

function onglet(nom) {
  for (const n of ["boosters", "collection"]) {
    $("#t-" + n).setAttribute("aria-selected", String(n === nom));
    $("#v-" + n).hidden = n !== nom;
  }
  if (nom === "collection") majCollection();
}

/* ---------- démarrage ---------- */
async function texte(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + " : erreur " + r.status);
  return r.text();
}

async function demarrer() {
  try {
    const [cartesTxt, moteurSrc] = await Promise.all([texte("cartes.json"), texte("moteur.py")]);
    CARTES_TXT = cartesTxt;
    CARTES = JSON.parse(cartesTxt);
    const pyodide = await loadPyodide();
    pyodide.runPython(moteurSrc);
    ouvrirPy = pyodide.globals.get("ouvrir_booster_web");
    REGL = JSON.parse(pyodide.globals.get("reglages_web")());
    etat = lireSauvegarde() || REGL.etat_initial;

    $("#pack-nb").textContent = pluriel(REGL.taille_booster, "carte", "cartes");
    const points = $("#pack-points");
    REGL.ordre.forEach((_, r) => { const p = el("span"); p.dataset.r = r; points.append(p); });

    majStats();
    majCollection();
    $("#t-collection").disabled = false;
    $("#pack").disabled = false;
    phase = "pret";
    majMessage();
  } catch (e) {
    console.error(e);
    $("#message").textContent =
      "Le jeu n'a pas pu démarrer (" + (e.message || e) + "). " +
      "Ouvre la page depuis son adresse en ligne, ou en local avec « python -m http.server », pas en double-cliquant sur le fichier.";
  }
}

$("#pack").addEventListener("click", ouvrir);
$("#btn-tout").addEventListener("click", toutRetourner);
$("#btn-autre").addEventListener("click", autreBooster);
$("#t-boosters").addEventListener("click", () => onglet("boosters"));
$("#t-collection").addEventListener("click", () => onglet("collection"));
$("#reset").addEventListener("click", () => {
  if (phase === "chargement") return;
  if (!confirm("Effacer toute ta collection et repartir de zéro ?")) return;
  etat = structuredClone(REGL.etat_initial);
  gainRestant = 0;
  ecrireSauvegarde();
  majStats();
  majCollection();
  if (phase !== "ouverture") autreBooster();
});

demarrer();
</script>
